<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pépin Peinture — Recettes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #185FA5; --blue-light: #E6F1FB; --blue-mid: #378ADD;
    --amber: #BA7517; --amber-light: #FAEEDA;
    --green: #3B6D11; --green-light: #EAF3DE;
    --red: #A32D2D; --red-light: #FCEBEB;
    --gray: #5F5E5A; --gray-light: #F1EFE8;
    --bg: #f5f5f3; --surface: #ffffff;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.2);
    --text: #1a1a18; --text-2: #5f5e5a; --text-3: #888780;
    --radius: 8px; --radius-lg: 12px;
  }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* LOGIN */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 36px 32px; width: 100%; max-width: 380px; }
  .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; justify-content: center; }
  .login-logo-icon { width: 36px; height: 36px; background: var(--blue); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .login-logo-icon svg { width: 20px; height: 20px; fill: white; }
  .login-title { font-size: 17px; font-weight: 600; color: var(--text); }
  .login-subtitle { font-size: 13px; color: var(--text-3); text-align: center; margin-bottom: 24px; }
  .login-fg { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .login-fg label { font-size: 12px; font-weight: 500; color: var(--text-2); }
  .login-fg input { padding: 9px 12px; font-size: 14px; border: 0.5px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text); }
  .login-fg input:focus { outline: none; border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(55,138,221,0.1); }
  .login-btn { width: 100%; padding: 10px; font-size: 14px; font-weight: 500; background: var(--blue); color: white; border: none; border-radius: var(--radius); cursor: pointer; margin-top: 6px; }
  .login-btn:hover { background: #0C447C; }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .login-err { font-size: 12px; color: var(--red); background: var(--red-light); padding: 8px 12px; border-radius: var(--radius); margin-bottom: 14px; display: none; }

  /* APP */
  .app { display: none; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:var(--surface); border-bottom:0.5px solid var(--border); position:sticky; top:0; z-index:100; }
  .topbar-left { display:flex; align-items:center; gap:10px; }
  .logo { width:30px; height:30px; background:var(--blue); border-radius:7px; display:flex; align-items:center; justify-content:center; }
  .logo svg { width:17px; height:17px; fill:white; }
  .app-title { font-size:15px; font-weight:600; }
  .topbar-right { display:flex; align-items:center; gap:10px; }
  .role-pill { font-size:11px; padding:3px 10px; border-radius:20px; font-weight:500; }
  .role-admin { background:var(--blue-light); color:var(--blue); border:0.5px solid var(--blue-mid); }
  .role-comptoir { background:var(--amber-light); color:var(--amber); border:0.5px solid #EF9F27; }
  .role-prod { background:var(--green-light); color:var(--green); border:0.5px solid #639922; }
  .logout-btn { font-size:12px; color:var(--text-3); background:none; border:0.5px solid var(--border); border-radius:var(--radius); padding:4px 10px; cursor:pointer; }
  .logout-btn:hover { color:var(--red); border-color:var(--red); }
  .tabs { display:flex; background:var(--surface); border-bottom:0.5px solid var(--border); padding:0 20px; }
  .tab { font-size:13px; padding:10px 14px; color:var(--text-2); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-0.5px; background:none; border-top:none; border-left:none; border-right:none; }
  .tab.active { color:var(--blue); border-bottom-color:var(--blue); font-weight:500; }
  .content { max-width:860px; margin:0 auto; padding:20px; }
  .toolbar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .search-wrap { flex:1; min-width:200px; position:relative; }
  .search-wrap input { width:100%; padding:8px 12px 8px 34px; font-size:13px; border:0.5px solid var(--border-strong); border-radius:var(--radius); background:var(--surface); color:var(--text); }
  .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-3); font-size:14px; pointer-events:none; }
  select.filter { font-size:13px; padding:8px 12px; border:0.5px solid var(--border-strong); border-radius:var(--radius); background:var(--surface); color:var(--text); cursor:pointer; }
  .grid { display:grid; gap:10px; }
  .card { background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; cursor:pointer; transition:border-color 0.15s; }
  .card:hover { border-color:var(--border-strong); }
  .card.active { border:1.5px solid var(--blue-mid); }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .card-name { font-size:14px; font-weight:600; }
  .card-sub { font-size:12px; color:var(--text-2); margin-top:2px; }
  .badges { display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .badge { font-size:11px; padding:2px 8px; border-radius:20px; }
  .badge-pepin { background:var(--blue-light); color:var(--blue); }
  .badge-inter { background:#EAF3DE; color:#3B6D11; }
  .badge-devoe { background:#FAEEDA; color:#BA7517; }
  .badge-disolac { background:#FBEAF0; color:#993556; }
  .badge-qty { background:var(--gray-light); color:var(--gray); }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .chip { font-size:11px; background:var(--bg); border:0.5px solid var(--border); border-radius:var(--radius); padding:2px 8px; color:var(--text-2); }
  .prix-row { display:flex; gap:12px; margin-top:10px; padding-top:10px; border-top:0.5px solid var(--border); flex-wrap:wrap; align-items:center; }
  .prix-item { font-size:12px; }
  .prix-item span:first-child { color:var(--text-2); }
  .prix-item span:last-child { font-weight:500; }
  .date-badge { margin-left:auto; font-size:11px; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .date-fresh { background:var(--green-light); color:var(--green); }
  .date-old { background:var(--amber-light); color:var(--amber); }
  .date-stale { background:var(--red-light); color:var(--red); }
  .detail { background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:20px; }
  .detail-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .detail-title { font-size:18px; font-weight:600; }
  .detail-sub { font-size:13px; color:var(--text-2); margin-top:3px; }
  .section-title { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); margin:18px 0 8px; }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .info-item .k { font-size:12px; color:var(--text-2); margin-bottom:2px; }
  .info-item .v { font-size:13px; font-weight:500; }
  table.ctable { width:100%; border-collapse:collapse; font-size:13px; }
  table.ctable thead { background:var(--bg); }
  table.ctable th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); font-weight:500; padding:6px 10px; border-bottom:0.5px solid var(--border); }
  table.ctable td { padding:8px 10px; border-bottom:0.5px solid var(--border); }
  table.ctable tr:last-child td { border-bottom:none; }
  table.ctable .qty { text-align:right; font-weight:600; color:var(--blue); }
  table.ctable .unit { color:var(--text-2); font-size:12px; }
  .prix-box { background:var(--amber-light); border:0.5px solid #FAC775; border-radius:var(--radius); padding:14px; margin-top:16px; }
  .prix-box-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:6px; }
  .prix-box-title { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--amber); }
  .prix-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .prix-card { background:white; border-radius:var(--radius); padding:8px 10px; }
  .prix-card .lbl { font-size:11px; color:var(--gray); margin-bottom:2px; }
  .prix-card .val { font-size:15px; font-weight:600; color:var(--amber); }
  .hidden-box { background:var(--gray-light); border:0.5px dashed var(--border-strong); border-radius:var(--radius); padding:12px; margin-top:16px; text-align:center; font-size:12px; color:var(--text-3); }
  .form-wrap { background:var(--surface); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:20px; }
  .form-title { font-size:15px; font-weight:600; margin-bottom:16px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .fg { display:flex; flex-direction:column; gap:4px; }
  .fg.full { grid-column:1/-1; }
  .fg label { font-size:12px; font-weight:500; color:var(--text-2); }
  .fg input, .fg select, .fg textarea { padding:8px 10px; font-size:13px; border:0.5px solid var(--border-strong); border-radius:var(--radius); background:var(--surface); color:var(--text); }
  .fg textarea { resize:vertical; min-height:60px; }
  .cform-head { display:grid; grid-template-columns:2.5fr 1fr 1.2fr 28px; gap:6px; margin-bottom:4px; }
  .cform-head span { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); font-weight:500; }
  .crow { display:grid; grid-template-columns:2.5fr 1fr 1.2fr 28px; gap:6px; align-items:center; margin-bottom:6px; }
  .crow input, .crow select { padding:6px 8px; font-size:13px; border:0.5px solid var(--border-strong); border-radius:var(--radius); background:var(--surface); color:var(--text); }
  .rm-btn { background:none; border:none; cursor:pointer; color:var(--text-3); font-size:18px; line-height:1; }
  .rm-btn:hover { color:var(--red); }
  .add-c-btn { font-size:12px; color:var(--blue); background:none; border:none; cursor:pointer; padding:4px 0; margin-top:2px; }
  .form-actions { display:flex; gap:8px; margin-top:18px; justify-content:flex-end; align-items:center; }
  .btn { font-size:13px; padding:8px 16px; border-radius:var(--radius); cursor:pointer; border:0.5px solid var(--border-strong); background:var(--surface); color:var(--text); }
  .btn-primary { background:var(--blue); color:white; border-color:var(--blue); font-weight:500; }
  .btn-primary:hover { background:#0C447C; }
  .btn-back { font-size:13px; padding:7px 14px; border-radius:var(--radius); cursor:pointer; border:0.5px solid var(--border); background:var(--surface); color:var(--text-2); margin-bottom:12px; }
  .empty { text-align:center; padding:48px; color:var(--text-3); font-size:13px; }
  .loading { text-align:center; padding:48px; color:var(--text-3); font-size:13px; }
  .toast { position:fixed; bottom:24px; right:24px; background:#1a1a18; color:white; font-size:13px; padding:10px 18px; border-radius:var(--radius); z-index:999; display:none; }
  .toast.show { display:block; animation: fadeup .2s ease; }
  @keyframes fadeup { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .count-label { font-size:12px; color:var(--text-3); margin-bottom:10px; }
  .err { font-size:12px; color:var(--red); background:var(--red-light); padding:8px 12px; border-radius:var(--radius); margin-bottom:12px; display:none; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a1 1 0 00-1.41 0L9 12.25 11.75 15l8.96-8.96a1 1 0 000-1.41z"/></svg>
      </div>
      <span class="login-title">Pépin Peinture</span>
    </div>
    <div class="login-subtitle">Connectez-vous pour accéder aux recettes</div>
    <div class="login-err" id="login-err"></div>
    <div class="login-fg">
      <label>Courriel</label>
      <input type="email" id="login-email" placeholder="votre@courriel.com" autocomplete="email"/>
    </div>
    <div class="login-fg">
      <label>Mot de passe</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Se connecter</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a1 1 0 00-1.41 0L9 12.25 11.75 15l8.96-8.96a1 1 0 000-1.41z"/></svg>
      </div>
      <span class="app-title">Pépin Peinture</span>
    </div>
    <div class="topbar-right">
      <span class="role-pill" id="role-pill"></span>
      <span id="user-name" style="font-size:12px;color:var(--text-2);"></span>
      <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-liste" onclick="showView('liste',this)">Recettes</button>
    <button class="tab" id="tab-ajouter" style="display:none;" onclick="showView('ajouter',this)">+ Ajouter</button>
    <button class="tab" id="tab-detail" style="display:none;" onclick="showView('detail',this)">Fiche</button>
  </div>

  <div class="content">
    <div id="view-liste">
      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input type="text" id="search" placeholder="Client, couleur, numéro..." oninput="filterAndRender()"/>
        </div>
        <select class="filter" id="filter-marque" onchange="filterAndRender()">
          <option value="">Toutes les marques</option>
          <option>Pépin</option><option>International</option><option>Devoe</option><option>Disolac</option>
        </select>
      </div>
      <div class="count-label" id="count-label"></div>
      <div class="err" id="list-err"></div>
      <div class="grid" id="grid"></div>
    </div>

    <div id="view-detail" style="display:none;">
      <button class="btn-back" onclick="showView('liste',document.getElementById('tab-liste'))">&larr; Retour</button>
      <div class="detail" id="detail-panel"></div>
    </div>

    <div id="view-ajouter" style="display:none;">
      <div class="form-wrap">
        <div class="form-title">Nouvelle recette client</div>
        <div class="err" id="form-err"></div>
        <div class="form-grid">
          <div class="fg"><label>Client *</label><input id="f-client" placeholder="Ex: JRM"/></div>
          <div class="fg"><label>Couleur *</label><input id="f-couleur" placeholder="Ex: Rouge JRM"/></div>
          <div class="fg"><label>Numéro couleur</label><input id="f-num" placeholder="Ex: L0620EB"/></div>
          <div class="fg"><label>Marque *</label>
            <select id="f-marque"><option value="">Choisir...</option><option>Pépin</option><option>International</option><option>Devoe</option><option>Disolac</option></select>
          </div>
          <div class="fg"><label>Produit</label><input id="f-produit" placeholder="Ex: Northane"/></div>
          <div class="fg"><label>Numéro de base</label><input id="f-base" placeholder="Ex: NT4291C"/></div>
          <div class="fg"><label>Quantité</label>
            <select id="f-qty"><option>Gallon</option><option>Pinte</option><option>Canette</option><option>5 gallons</option></select>
          </div>
          <div class="fg"><label>OKÉ</label><input id="f-oke" placeholder="Ex: 2026"/></div>
          <div class="fg full"><label>Notes</label><textarea id="f-notes" placeholder="Informations supplémentaires..."></textarea></div>
        </div>
        <div class="section-title" style="margin-top:20px;">Colorants</div>
        <div class="cform-head"><span>Colorant</span><span>Quantité</span><span>Unité</span><span></span></div>
        <div id="cform"></div>
        <button class="add-c-btn" onclick="addCRow()">+ Ajouter un colorant</button>
        <div id="prix-section">
          <div class="section-title" style="margin-top:20px;">Prix</div>
          <div class="form-grid">
            <div class="fg"><label>Cost base ($)</label><input type="number" id="f-cb" placeholder="0.00" step="0.01"/></div>
            <div class="fg"><label>Cost colorant ($)</label><input type="number" id="f-cc" placeholder="0.00" step="0.01"/></div>
            <div class="fg"><label>Cost catalyseur ($)</label><input type="number" id="f-ccat" placeholder="0.00" step="0.01"/></div>
            <div class="fg"><label>Prix vente gallon ($)</label><input type="number" id="f-pg" placeholder="0.00" step="0.01"/></div>
            <div class="fg"><label>Prix vente pinte ($)</label><input type="number" id="f-pp" placeholder="0.00" step="0.01"/></div>
            <div class="fg"><label>Prix vente canette ($)</label><input type="number" id="f-pc" placeholder="0.00" step="0.01"/></div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn" onclick="showView('liste',document.getElementById('tab-liste'))">Annuler</button>
          <button class="btn btn-primary" id="save-btn" onclick="saveRecette()">Sauvegarder</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://dsugwdwjjdmtwnyrukag.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzdWd3ZHdqamRtdHdueXJ1a2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1ODY1MjAsImV4cCI6MjA5MzE2MjUyMH0.CU5yDSRgtn6Z_GSJ2IkD7cS8Y_vR4fauY4S-ee-DGek';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentRole = null;
let allRecettes = [];
let selectedId = null;

// ── AUTH ──────────────────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-err');
  const btn   = document.getElementById('login-btn');
  errEl.style.display = 'none';
  if (!email || !pass) { errEl.textContent = 'Veuillez entrer votre courriel et mot de passe.'; errEl.style.display = 'block'; return; }
  btn.textContent = 'Connexion...'; btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) { errEl.textContent = 'Courriel ou mot de passe incorrect.'; errEl.style.display = 'block'; btn.textContent = 'Se connecter'; btn.disabled = false; return; }
  await initApp(data.user);
}

async function doLogout() {
  await sb.auth.signOut();
  currentUser = null; currentRole = null; allRecettes = []; selectedId = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-btn').textContent = 'Se connecter';
  document.getElementById('login-btn').disabled = false;
}

async function initApp(user) {
  currentUser = user;
  const { data: profile } = await sb.from('profiles').select('role, nom').eq('id', user.id).single();
  currentRole = profile?.role || 'production';
  const nom = profile?.nom || user.email;
  document.getElementById('user-name').textContent = nom;
  const pill = document.getElementById('role-pill');
  pill.textContent = currentRole.charAt(0).toUpperCase() + currentRole.slice(1);
  pill.className = 'role-pill ' + (currentRole==='admin'?'role-admin':currentRole==='comptoir'?'role-comptoir':'role-prod');
  // Onglet Ajouter seulement pour admin et comptoir
  document.getElementById('tab-ajouter').style.display = ['admin','comptoir'].includes(currentRole) ? '' : 'none';
  // Section prix dans formulaire
  document.getElementById('prix-section').style.display = ['admin','comptoir'].includes(currentRole) ? '' : 'none';
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadRecettes();
}

// Vérifier session existante au chargement
sb.auth.getSession().then(({ data: { session } }) => {
  if (session?.user) initApp(session.user);
});

// ── HELPERS ───────────────────────────────────────────────────────────
function ageDays(d) { return d ? Math.floor((Date.now()-new Date(d))/86400000) : 9999; }
function fmtDate(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  const mo = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  return `${parseInt(d)} ${mo[parseInt(m)-1]}. ${y}`;
}
function dateBadge(dateStr) {
  if (!dateStr) return '';
  const d = ageDays(dateStr);
  const cls = d<=90?'date-fresh':d<=365?'date-old':'date-stale';
  return `<span class="date-badge ${cls}">● Prix du ${fmtDate(dateStr)}</span>`;
}
function marqueClass(m) {
  return {'Pépin':'badge-pepin','International':'badge-inter','Devoe':'badge-devoe','Disolac':'badge-disolac'}[m]||'badge-qty';
}
function showView(name, tabEl) {
  ['liste','detail','ajouter'].forEach(v => document.getElementById('view-'+v).style.display = v===name?'':'none');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (tabEl) tabEl.classList.add('active');
}
function toast(msg, dur=2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}
function canSeePrix() { return ['admin','comptoir'].includes(currentRole); }

// ── DATA ──────────────────────────────────────────────────────────────
async function loadRecettes() {
  document.getElementById('grid').innerHTML = '<div class="loading">Chargement des recettes...</div>';
  const { data, error } = await sb.from('recettes').select('*, colorants(*), prix(*)').order('created_at', {ascending: false});
  if (error) { document.getElementById('list-err').textContent = 'Erreur: '+error.message; document.getElementById('list-err').style.display='block'; return; }
  allRecettes = data || [];
  filterAndRender();
}

function filterAndRender() {
  const q = (document.getElementById('search').value||'').toLowerCase();
  const marque = document.getElementById('filter-marque').value;
  const filtered = allRecettes.filter(r => {
    const match = !q || r.client.toLowerCase().includes(q) || r.couleur.toLowerCase().includes(q) || (r.numero_couleur||'').toLowerCase().includes(q);
    return match && (!marque || r.marque===marque);
  });
  document.getElementById('count-label').textContent = filtered.length+' recette'+(filtered.length!==1?'s':'')+' affichée'+(filtered.length!==1?'s':'');
  const g = document.getElementById('grid');
  if (!filtered.length) { g.innerHTML='<div class="empty">Aucune recette trouvée</div>'; return; }
  g.innerHTML = filtered.map(r => {
    const p = r.prix?.[0];
    const colorants = (r.colorants||[]).sort((a,b)=>a.ordre-b.ordre);
    const prixHTML = canSeePrix() && p ? `
      <div class="prix-row">
        ${p.prix_gallon?`<div class="prix-item"><span>Gallon&nbsp;</span><span>${parseFloat(p.prix_gallon).toFixed(2)} $</span></div>`:''}
        ${p.prix_pinte?`<div class="prix-item"><span>Pinte&nbsp;</span><span>${parseFloat(p.prix_pinte).toFixed(2)} $</span></div>`:''}
        <div class="prix-item"><span>Cost&nbsp;</span><span>${(parseFloat(p.cost_base||0)+parseFloat(p.cost_colorant||0)+parseFloat(p.cost_catalyseur||0)).toFixed(2)} $</span></div>
        ${dateBadge(p.date_prix)}
      </div>` : '';
    return `<div class="card${selectedId===r.id?' active':''}" onclick="openDetail('${r.id}')">
      <div class="card-top">
        <div><div class="card-name">${r.couleur}</div><div class="card-sub">${r.client}${r.numero_couleur?' &nbsp;·&nbsp; #'+r.numero_couleur:''}</div></div>
        <div class="badges">
          <span class="badge ${marqueClass(r.marque)}">${r.marque}</span>
          <span class="badge badge-qty">${r.quantite||'Gallon'}</span>
        </div>
      </div>
      <div class="chips">${colorants.map(c=>`<span class="chip">${c.nom}</span>`).join('')}</div>
      ${prixHTML}
    </div>`;
  }).join('');
}

async function openDetail(id) {
  selectedId = id;
  document.getElementById('tab-detail').style.display='';
  showView('detail', document.getElementById('tab-detail'));
  filterAndRender();
  const r = allRecettes.find(x=>x.id===id);
  if (!r) return;
  const p = r.prix?.[0];
  const colorants = (r.colorants||[]).sort((a,b)=>a.ordre-b.ordre);
  const total = p ? (parseFloat(p.cost_base||0)+parseFloat(p.cost_colorant||0)+parseFloat(p.cost_catalyseur||0)) : 0;
  const d = ageDays(p?.date_prix);
  const ageTxt = d<=90?'Récent':d<=365?'À vérifier':'À mettre à jour';
  const ageCls = d<=90?'date-fresh':d<=365?'date-old':'date-stale';
  document.getElementById('detail-panel').innerHTML = `
    <div class="detail-head">
      <div><div class="detail-title">${r.couleur}</div><div class="detail-sub">${r.client}${r.numero_couleur?' &nbsp;·&nbsp; #'+r.numero_couleur:''}</div></div>
      <div class="badges"><span class="badge ${marqueClass(r.marque)}">${r.marque}</span><span class="badge badge-qty">${r.quantite||'Gallon'}</span></div>
    </div>
    <div class="section-title">Informations générales</div>
    <div class="info-grid">
      <div class="info-item"><div class="k">Produit</div><div class="v">${r.produit||'—'}</div></div>
      <div class="info-item"><div class="k">Numéro de base</div><div class="v">${r.numero_base||'—'}</div></div>
      <div class="info-item"><div class="k">Date recette</div><div class="v">${fmtDate(r.date_recette)}</div></div>
      <div class="info-item"><div class="k">OKÉ</div><div class="v">${r.oke||'—'}</div></div>
      ${r.notes?`<div class="info-item" style="grid-column:1/-1;"><div class="k">Notes</div><div class="v">${r.notes}</div></div>`:''}
    </div>
    <div class="section-title">Colorants</div>
    <table class="ctable">
      <thead><tr><th>Colorant</th><th style="text-align:right;">Quantité</th><th>Unité</th></tr></thead>
      <tbody>${colorants.map((c,i)=>`<tr style="${i%2===1?'background:var(--bg);':''}"><td><strong>${c.nom}</strong></td><td class="qty">${c.quantite||''}</td><td class="unit">${c.unite||''}</td></tr>`).join('')}</tbody>
    </table>
    ${canSeePrix() && p ? `
    <div class="prix-box">
      <div class="prix-box-head">
        <span class="prix-box-title">Prix — comptoir seulement</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="date-badge ${ageCls}">● ${fmtDate(p.date_prix)}</span>
          <span style="font-size:11px;color:var(--text-3);">${ageTxt}</span>
        </div>
      </div>
      <div class="prix-cards">
        <div class="prix-card"><div class="lbl">Cost base</div><div class="val">${parseFloat(p.cost_base||0).toFixed(2)} $</div></div>
        <div class="prix-card"><div class="lbl">Cost colorant</div><div class="val">${parseFloat(p.cost_colorant||0).toFixed(2)} $</div></div>
        <div class="prix-card"><div class="lbl">Cost catalyseur</div><div class="val">${parseFloat(p.cost_catalyseur||0).toFixed(2)} $</div></div>
        <div class="prix-card" style="background:var(--amber-light);"><div class="lbl">Total cost</div><div class="val">${total.toFixed(2)} $</div></div>
        ${p.prix_gallon?`<div class="prix-card"><div class="lbl">Prix gallon</div><div class="val">${parseFloat(p.prix_gallon).toFixed(2)} $</div></div>`:''}
        ${p.prix_pinte?`<div class="prix-card"><div class="lbl">Prix pinte</div><div class="val">${parseFloat(p.prix_pinte).toFixed(2)} $</div></div>`:''}
        ${p.prix_canette?`<div class="prix-card"><div class="lbl">Prix canette</div><div class="val">${parseFloat(p.prix_canette).toFixed(2)} $</div></div>`:''}
      </div>
    </div>` : canSeePrix() ? '' : `<div class="hidden-box">Prix non disponibles — vue Production</div>`}
  `;
}

// ── FORMULAIRE ────────────────────────────────────────────────────────
function addCRow(nom='',qty='',unit='OZ') {
  const row = document.createElement('div');
  row.className = 'crow';
  row.innerHTML = `
    <input type="text" placeholder="Ex: STX42, 307LB..." class="c-nom" value="${nom}"/>
    <input type="text" placeholder="Ex: 2.5" class="c-qty" value="${qty}"/>
    <select class="c-unit">${['OZ','GR','1/48','1/64','1/128'].map(u=>`<option${u===unit?' selected':''}>${u}</option>`).join('')}</select>
    <button class="rm-btn" onclick="this.parentElement.remove()">×</button>`;
  document.getElementById('cform').appendChild(row);
}

async function saveRecette() {
  const client = document.getElementById('f-client').value.trim();
  const couleur = document.getElementById('f-couleur').value.trim();
  const marque = document.getElementById('f-marque').value;
  const errEl = document.getElementById('form-err');
  errEl.style.display='none';
  if (!client||!couleur||!marque) { errEl.textContent='Client, couleur et marque sont requis.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('save-btn');
  btn.textContent='Sauvegarde...'; btn.disabled=true;
  const { data: rec, error: recErr } = await sb.from('recettes').insert({
    client, couleur,
    numero_couleur: document.getElementById('f-num').value.trim()||null,
    marque,
    produit: document.getElementById('f-produit').value.trim()||null,
    numero_base: document.getElementById('f-base').value.trim()||null,
    quantite: document.getElementById('f-qty').value,
    oke: document.getElementById('f-oke').value.trim()||null,
    notes: document.getElementById('f-notes').value.trim()||null,
  }).select().single();
  if (recErr) { errEl.textContent='Erreur: '+recErr.message; errEl.style.display='block'; btn.textContent='Sauvegarder'; btn.disabled=false; return; }
  const colorants = [];
  document.querySelectorAll('#cform .crow').forEach((row,i) => {
    const nom = row.querySelector('.c-nom').value.trim();
    if (nom) colorants.push({recette_id:rec.id, nom, quantite:row.querySelector('.c-qty').value.trim(), unite:row.querySelector('.c-unit').value, ordre:i});
  });
  if (colorants.length) await sb.from('colorants').insert(colorants);
  const cb=parseFloat(document.getElementById('f-cb').value)||0;
  const cc=parseFloat(document.getElementById('f-cc').value)||0;
  const ccat=parseFloat(document.getElementById('f-ccat').value)||0;
  const pg=parseFloat(document.getElementById('f-pg').value)||null;
  const pp=parseFloat(document.getElementById('f-pp').value)||null;
  const pc=parseFloat(document.getElementById('f-pc').value)||null;
  if (cb||cc||ccat||pg||pp||pc) {
    await sb.from('prix').insert({recette_id:rec.id, cost_base:cb, cost_colorant:cc, cost_catalyseur:ccat, prix_gallon:pg, prix_pinte:pp, prix_canette:pc, date_prix:new Date().toISOString().slice(0,10)});
  }
  toast('Recette sauvegardée!');
  btn.textContent='Sauvegarder'; btn.disabled=false;
  ['f-client','f-couleur','f-num','f-produit','f-base','f-oke','f-notes','f-cb','f-cc','f-ccat','f-pg','f-pp','f-pc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-marque').value='';
  document.getElementById('cform').innerHTML='';
  addCRow();
  await loadRecettes();
  showView('liste', document.getElementById('tab-liste'));
}

addCRow();
</script>
</body>
</html>
